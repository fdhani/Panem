name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  DEVPOD_VERSION: v0.6.15 # keep in sync with DEVPOD_VERSION in packages/backend-devpod

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: sudo apt-get update && sudo apt-get install -y socat
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: panem-linux-x64
          path: dist/panem

  feature:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -x -P SCRIPTDIR features/src/*/install.sh features/src/panem/scripts/*.sh features/src/*/agent/*.sh features/test/*/*.sh packages/controller/src/pod/*.sh
      - run: npm install -g @devcontainers/cli@0.72.0
      # Scenarios only (test/claude-code/scenarios.json): they skip the Claude Code install,
      # which downloads from claude.ai and hung CI.
      - run: devcontainer features test --project-folder features --features panem claude-code --skip-autogenerated

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install DevPod
        run: |
          curl -fsSL -o /usr/local/bin/devpod \
            "https://github.com/loft-sh/devpod/releases/download/${DEVPOD_VERSION}/devpod-linux-amd64"
          chmod +x /usr/local/bin/devpod
          devpod version
      - name: Build forwarder image
        run: |
          v=$(bun -e 'import { PANEM_VERSION } from "@panem/core"; console.log(PANEM_VERSION)')
          docker build -f packages/forwarder/Dockerfile -t "ghcr.io/fdhani/panem/forwarder:$v" .
      - run: bun scripts/integration.ts
